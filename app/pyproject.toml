[project]
name = "app"
version = "0.0.0"
description = "FastAPI service — framework, DB, IO, transport. Depends on engine."
requires-python = ">=3.12"
dependencies = [
    "engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "sqlalchemy[asyncio]>=2",
    "alembic>=1.13",
    "redis>=5",
    "psycopg[binary]>=3.3.4",
    "asyncpg>=0.31.0",
    "pyjwt>=2.9",
]

[tool.uv.sources]
engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
